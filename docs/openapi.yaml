openapi: 3.1.0
info:
  title: Common Hosted Subscription for Event Notifications (CHOSEN) API
  version: 0.1.0-draft
  summary: Manage subscribers, consent and opt-outs for notifications sent through Notify.
  description: |
    Draft for review. See `docs/data-model.md` for the decisions behind this API.

    **Callers**

    | Caller | Authentication | Uses |
    |---|---|---|
    | A tenant's backend (e.g. a line-of-business app) | `tenantAuth` | Topics, subscriptions, contacts, suppressions, history |
    | Notify | `notifyAuth`; webhooks also need `webhookSignature` | Recipient lookup, inbound SMS, delivery events |
    | The public, through links CHOSEN sends | A token in the path | Confirm, unsubscribe, manage subscriptions |
    | Tenant staff, in CHOSEN's UI | `tenantUserAuth` | The tenant's client credentials |
    | CHOSEN operators | `adminAuth` | Tenants, Notify's client credentials |

    Services authenticate with OAuth2 client credentials that their tenant creates in CHOSEN
    (`/credentials`). CHOSEN has the API Services Portal issue them and links each client ID to
    the tenant. Every caller except the public reaches CHOSEN through the Kong API gateway, which
    checks the token and applies rate limits. CHOSEN then checks the token again and finds the
    tenant, or Notify, from its client ID (`azp`). Kong is the only way to the backend: CHOSEN's
    own UI and the public pages behind its links call the API through the gateway too, the public
    endpoints without credentials and rate-limited per IP address.

    **Conventions**

    - Every tenant endpoint only sees the calling tenant's data. An ID from another tenant returns `404`.
    - Lists use cursor pagination: pass `nextCursor` back as `cursor` until it's `null`.
    - Errors use `application/problem+json` (RFC 9457).
    - Addresses are normalised before they're stored or compared: phone numbers to E.164, emails trimmed and lower-cased.
    - Times are ISO 8601 in UTC.

    **MCP**

    Operations marked `x-mcp-tool` are also exposed as tools by CHOSEN's MCP layer, under that name. The REST operation is the source of truth for parameters and results.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /api/v1

tags:
  - name: Topics
    description: Things people can subscribe to, with their channels and filter fields.
  - name: Subscriptions
    description: Subscribe, change filters and unsubscribe.
  - name: Contacts
    description: A tenant's verified addresses.
  - name: Suppressions
    description: Addresses that must not be sent to.
  - name: History
    description: Consent evidence and audit trail.
  - name: Recipients
    description: Called by Notify when it sends.
  - name: Inbound
    description: Webhooks from Notify for inbound SMS and delivery events.
  - name: Public
    description: Called by CHOSEN's hosted pages and by mail clients. Authorised by the token in the link.
  - name: Credentials
    description: Client credentials a tenant's services use to call CHOSEN. Managed by tenant staff in CHOSEN's UI.
  - name: Admin
    description: CHOSEN operators.

security:
  - tenantAuth: []

paths:
  # ---------------------------------------------------------------- Topics
  /topics:
    get:
      tags: [Topics]
      operationId: listTopics
      summary: List the tenant's topics
      x-mcp-tool: list_topics
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TopicStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of topics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Topics]
      operationId: createTopic
      summary: Create a topic
      description: |
        Creates a topic with its channels and filter fields.
        Each channel's `smsKeyword` must be unique across CHOSEN and must not be a system keyword
        (`STOP`, `START`, `HELP`, `INFO`, `YES`) or a provider's reserved opt-out word.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopicCreate' }
      responses:
        '201':
          description: The topic was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The `key` is already used by this tenant, or an `smsKeyword` is already taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /topics/{topicKey}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    get:
      tags: [Topics]
      operationId: getTopic
      summary: Get a topic
      x-mcp-tool: get_topic
      responses:
        '200':
          description: The topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Topics]
      operationId: updateTopic
      summary: Update a topic's settings
      description: |
        Changes top-level settings. Channels and filter fields have their own endpoints.
        Setting `status` to `ARCHIVED` stops the topic being offered and returned by recipient queries;
        its subscriptions and history are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopicUpdate' }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topicKey}/channels/{channel}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
      - name: channel
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Channel' }
    put:
      tags: [Topics]
      operationId: putTopicChannel
      summary: Add or replace a channel on a topic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopicChannelSettings' }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The `smsKeyword` is already taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Topics]
      operationId: deleteTopicChannel
      summary: Stop offering a channel on a topic
      description: Refused while the topic has active or pending subscriptions on this channel.
      responses:
        '204': { description: The channel was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still use this channel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /topics/{topicKey}/filter-fields:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    post:
      tags: [Topics]
      operationId: addFilterField
      summary: Add a filter field to a topic
      description: |
        Existing subscriptions have no values for a new field, so they match any value of it.
        A new field can't be `required` while the topic has subscriptions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterField' }
      responses:
        '201':
          description: The updated topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A field with this name already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /topics/{topicKey}/filter-fields/{fieldName}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
      - name: fieldName
        in: path
        required: true
        schema: { $ref: '#/components/schemas/FilterFieldName' }
    patch:
      tags: [Topics]
      operationId: updateFilterField
      summary: Change a filter field's label or allowed values
      description: Removing an allowed value that subscriptions still use is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                allowedValues:
                  type: [array, 'null']
                  items: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still use a value being removed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Topics]
      operationId: deleteFilterField
      summary: Remove a filter field
      description: Refused while any subscription has values for the field.
      responses:
        '204': { description: The field was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still have values for this field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------- Subscriptions
  /topics/{topicKey}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: List a topic's subscriptions
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          description: Exact match only; addresses are stored encrypted.
          schema: { type: string }
        - name: externalSubjectId
          in: query
          description: Exact match only.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Subscriptions]
      operationId: subscribe
      summary: Subscribe an address to a topic
      x-mcp-tool: subscribe
      description: |
        Finds or creates the contact for the address, then the subscription.

        - If the topic's channel requires confirmation (double opt-in), the subscription is `PENDING` and
          CHOSEN sends a confirmation message through Notify. By email, the person confirms with the
          link. By SMS, they reply `YES` (or `<keyword> YES`), or use the link if the message has
          one. Otherwise the subscription is `ACTIVE` straight away.
        - If the address already has an `ACTIVE` or `PENDING` subscription to the topic, nothing
          changes and the existing subscription is returned with `200`. Use `updateSubscription`
          to change filters.
        - If the subscription was `UNSUBSCRIBED` or `EXPIRED`, it is subscribed again with the new
          consent and filters, and `201` is returned.
        - A suppressed address can still subscribe; `suppressed` is `true` in the response and it
          won't be returned as a recipient until the suppression is lifted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '200':
          description: Already subscribed; nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '201':
          description: Subscribed, or subscribed again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The topic doesn't offer this channel, the topic is archived, or the filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Get a subscription
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: Change a subscription's filter values
      x-mcp-tool: update_subscription_filters
      description: |
        Replaces the filter values. A field left out of `filters` keeps its values; a field set to
        an empty array matches anything. Recorded as a `FILTERS_CHANGED` consent event.
        Only `PENDING` and `ACTIVE` subscriptions can be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: The updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription is unsubscribed or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /subscriptions/{subscriptionId}/unsubscribe:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Subscriptions]
      operationId: unsubscribe
      summary: Unsubscribe from the topic
      x-mcp-tool: unsubscribe
      description: |
        Sets the subscription to `UNSUBSCRIBED` and cancels its unsubscribe links.
        Unsubscribing an already unsubscribed subscription returns it unchanged.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                actor:
                  type: string
                  maxLength: 200
                  description: Who asked, as recorded by the tenant, e.g. a staff user ID.
      responses:
        '200':
          description: The subscription, now unsubscribed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions/{subscriptionId}/resend-confirmation:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Subscriptions]
      operationId: resendConfirmation
      summary: Send the confirmation message again
      description: Issues a new confirmation link, cancels the previous one, and restarts the pending expiry.
      responses:
        '202': { description: The confirmation message was queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription isn't pending.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --------------------------------------------------------------- Contacts
  /contacts:
    get:
      tags: [Contacts]
      operationId: findContacts
      summary: Find contacts by address or external subject ID
      description: Exact matches only. At least one of `address` or `externalSubjectId` is required.
      parameters:
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          schema: { type: string }
        - name: externalSubjectId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Matching contacts; usually one or none.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact and all its subscriptions
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactWithSubscriptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contacts/{contactId}/change-address:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      operationId: changeContactAddress
      summary: Start changing a contact's address
      description: |
        Creates a new, unverified contact for the new address and sends it a verification message.
        When it's verified, the old contact's `ACTIVE` and `PENDING` subscriptions move to the new
        contact, keeping their filters, and the old contact is retired. Until then, messages keep
        going to the old address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: '#/components/schemas/Address' }
                actor: { type: string, maxLength: 200 }
      responses:
        '202':
          description: Verification sent to the new address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another contact of this tenant already has the new address.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /contacts/{contactId}/unsubscribe-all:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      operationId: unsubscribeContactFromAll
      summary: Unsubscribe a contact from all of the tenant's topics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                actor: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The contact and its subscriptions, now unsubscribed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactWithSubscriptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- Suppressions
  /suppressions:
    get:
      tags: [Suppressions]
      operationId: listSuppressions
      summary: List suppressions that affect the tenant's contacts
      description: |
        Includes the tenant's own suppressions and shared ones (SMS `STOP`, email hard bounces) that
        match one of its contacts. The reason for a shared suppression isn't shown.
      parameters:
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          description: Exact match only.
          schema: { type: string }
        - name: active
          in: query
          description: Only suppressions that haven't been lifted. Defaults to `true`.
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of suppressions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Suppression' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Suppressions]
      operationId: createSuppression
      summary: Suppress an address for this tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, address]
              properties:
                channel: { $ref: '#/components/schemas/Channel' }
                address: { $ref: '#/components/schemas/Address' }
                sender:
                  type: string
                  description: SMS only. Limit the suppression to one sender number.
                note: { type: string, maxLength: 500 }
                actor: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The suppression.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suppression' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /suppressions/{suppressionId}/lift:
    parameters:
      - name: suppressionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Suppressions]
      operationId: liftSuppression
      summary: Lift one of the tenant's suppressions
      description: |
        Only the tenant's own suppressions (manual or spam complaint) can be lifted.
        A shared SMS `STOP` is only lifted by the person texting `START`.
      responses:
        '200':
          description: The suppression, now lifted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suppression' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A shared suppression can't be lifted by a tenant.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- History
  /subscriptions/{subscriptionId}/consent-events:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [History]
      operationId: listConsentEvents
      summary: Consent history of a subscription
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Consent events, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConsentEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-events:
    get:
      tags: [History]
      operationId: listAuditEvents
      summary: Changes to the tenant's topics and settings
      parameters:
        - name: entityType
          in: query
          schema: { type: string, enum: [TOPIC, TOPIC_CHANNEL, FILTER_FIELD, SUPPRESSION, TENANT] }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- Recipients
  /recipients/query:
    post:
      tags: [Recipients]
      operationId: queryRecipients
      summary: Get the recipients for a send
      x-mcp-tool: get_recipients
      security:
        - notifyAuth: []
      description: |
        Called by Notify when it sends to a topic. Returns contacts that:

        1. have an `ACTIVE` subscription to the topic on `channel`;
        2. for every filter field where the subscriber chose values, chose at least one of the
           values in `filters`; and
        3. aren't suppressed. For SMS, that's no suppression for `sender`, shared or the tenant's
           own. For email, no shared suppression and none of the tenant's own.

        A filter field left out of `filters` doesn't restrict anything. Results are in a stable
        order; page through with `cursor`. A cursor is valid for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientQuery' }
      responses:
        '200':
          description: A page of recipients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The topic doesn't offer this channel, the topic is archived, or a filter field isn't one of the topic's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- Inbound
  /inbound/sms:
    post:
      tags: [Inbound]
      operationId: receiveInboundSms
      summary: An SMS reply received by Notify
      security:
        - notifyAuth: []
          webhookSignature: []
      description: |
        Notify receives the text from the provider and forwards it here. CHOSEN handles:

        | Text | What CHOSEN does |
        |---|---|
        | `STOP` (and the provider's other opt-out words) | Suppresses `from` for `to`, for every tenant. The provider has already blocked the number and sent its own reply. |
        | `START` | Lifts that suppression. Subscriptions resume as they were. |
        | `<keyword> OFF`, e.g. `ROADS OFF` | Unsubscribes `from` from that topic, and replies through Notify. |
        | `<keyword> YES`, e.g. `ROADS YES` | Confirms `from`'s pending subscription to that topic. |
        | `YES` | Confirms `from`'s pending subscription whose confirmation was sent from `to`. If there are several, nothing is confirmed and CHOSEN replies asking for `<keyword> YES`. |
        | `HELP`, `INFO` | Replies through Notify with general help and a link to manage subscriptions. |
        | Anything else | Records it as `UNRECOGNISED`; no reply. |

        Idempotent on `eventId`: a repeat delivery returns the first outcome and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundSms' }
      responses:
        '200':
          description: The text was processed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundSmsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inbound/delivery-events:
    post:
      tags: [Inbound]
      operationId: receiveDeliveryEvent
      summary: A delivery outcome from Notify that affects who can be contacted
      security:
        - notifyAuth: []
          webhookSignature: []
      description: |
        | `type` | What CHOSEN does |
        |---|---|
        | `EMAIL_HARD_BOUNCE` | Suppresses the address for every tenant. |
        | `EMAIL_COMPLAINT` | Suppresses the address for `tenantId` only. |
        | `SMS_OPTED_OUT` | The provider refused to send because the number had opted out (e.g. Twilio error 21610). Suppresses it for `sender`, in case CHOSEN missed the `STOP`. |

        Idempotent on `eventId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryEvent' }
      responses:
        '204': { description: The event was processed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Public
  /public/confirmations/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getConfirmation
      summary: Show what a confirmation link is for
      description: |
        Used by the hosted confirmation page. Viewing doesn't confirm: mail scanners open links,
        so confirming needs the `POST`.
      security: []
      responses:
        '200':
          description: What the person is confirming.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSubscriptionSummary' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }
    post:
      tags: [Public]
      operationId: confirmSubscription
      summary: Confirm a pending subscription
      security: []
      responses:
        '200':
          description: The subscription is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicActionResult' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  /public/unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getUnsubscribe
      summary: Show what an unsubscribe link is for
      description: Used by the hosted unsubscribe page. Viewing doesn't unsubscribe.
      security: []
      responses:
        '200':
          description: The subscription the link belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSubscriptionSummary' }
        '404': { $ref: '#/components/responses/InvalidToken' }
    post:
      tags: [Public]
      operationId: unsubscribeByLink
      summary: Unsubscribe from one topic
      description: |
        Called by the hosted page (JSON) and by mail clients' one-click unsubscribe (RFC 8058),
        which posts the form body `List-Unsubscribe=One-Click` to the URL in the
        `List-Unsubscribe` header. The token is signed, not stored; it stops working once the
        subscription's links are cancelled.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
      responses:
        '200':
          description: Unsubscribed, or already unsubscribed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicActionResult' }
        '404': { $ref: '#/components/responses/InvalidToken' }

  /public/topics/{topicId}/manage-link:
    parameters:
      - name: topicId
        in: path
        required: true
        description: The topic's ID, which is what the fixed "manage subscriptions" link in a template carries.
        schema: { type: string, format: uuid }
    post:
      tags: [Public]
      operationId: requestManageLink
      summary: Send a sign-in link to manage subscriptions
      description: |
        If the address belongs to a contact of the topic's tenant, CHOSEN sends it a sign-in link.
        The response is the same either way, so it can't be used to find out who is subscribed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, address]
              properties:
                channel: { $ref: '#/components/schemas/Channel' }
                address: { $ref: '#/components/schemas/Address' }
      responses:
        '202': { description: If the address is known, a sign-in link was sent. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/manage/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getManagedSubscriptions
      summary: The signed-in person's subscriptions with this tenant
      description: The sign-in token can be used repeatedly until it expires, 30 minutes after it's issued.
      security: []
      responses:
        '200':
          description: The person's subscriptions, with each topic's filter fields so the page can offer choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  /public/manage/{token}/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/SubscriptionId'
    patch:
      tags: [Public]
      operationId: updateManagedSubscription
      summary: Change filter values on one of the signed-in person's subscriptions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: The updated view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }
        '422':
          description: The filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/manage/{token}/subscriptions/{subscriptionId}/unsubscribe:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Public]
      operationId: unsubscribeManagedSubscription
      summary: Unsubscribe the signed-in person from one topic
      security: []
      responses:
        '200':
          description: The updated view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  # ------------------------------------------------------------ Credentials
  /credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List the tenant's client credentials
      description: Includes revoked credentials, newest first. Secrets are never returned here.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: includeRevoked
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The tenant's credentials.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      operationId: issueCredential
      summary: Create client credentials for the tenant
      description: |
        CHOSEN has the API Services Portal issue a consumer for CHOSEN's gateway, then links its
        client ID to the tenant. **The client secret is in this response only.** CHOSEN doesn't
        store it; if it's lost, rotate the credentials.

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiClientCreate' }
      responses:
        '201':
          description: The credentials, including the secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /credentials/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Credentials]
      operationId: rotateCredential
      summary: Replace the client secret
      description: |
        The API Services Portal issues a new secret for the same client ID; the old secret stops
        working. Tokens already issued with the old secret keep working until they expire, within
        minutes. **The new secret is in this response only.**

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The credentials, including the new secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /credentials/{clientId}/revoke:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Credentials]
      operationId: revokeCredential
      summary: Stop the credentials from calling CHOSEN
      description: |
        Takes effect immediately: CHOSEN refuses tokens for this client ID from now on, even ones
        that haven't expired. It can't be undone; create new credentials instead.

        The API Services Portal can't delete the consumer through its API yet, so it stays listed
        on the portal's Consumers page until removed there by hand.

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The revoked credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }

  # ------------------------------------------------------------------ Admin
  /admin/tenants:
    get:
      tags: [Admin]
      operationId: listTenants
      summary: List tenants
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tenants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      operationId: createTenant
      summary: Register a tenant
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, name, slug]
              properties:
                externalId:
                  type: string
                  description: The CSTAR tenant ID, the same one Notify uses.
                name: { type: string, maxLength: 200 }
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '201':
          description: The tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The `externalId` or `slug` is already registered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      operationId: updateTenant
      summary: Rename, suspend or reactivate a tenant
      description: A suspended tenant's API calls are refused and its topics return no recipients.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/system-credentials:
    get:
      tags: [Admin]
      operationId: listSystemCredentials
      summary: List client credentials for systems, such as Notify
      security:
        - adminAuth: []
      parameters:
        - name: includeRevoked
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The system credentials.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: issueSystemCredential
      summary: Create client credentials for a system, such as Notify
      description: |
        Like `issueCredential`, but the credentials belong to a system role instead of a tenant.
        A `NOTIFY` client can call the recipient and inbound endpoints for any tenant.
        **The client secret is in this response only.**
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemApiClientCreate' }
      responses:
        '201':
          description: The credentials, including the secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /admin/system-credentials/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Admin]
      operationId: rotateSystemCredential
      summary: Replace a system client's secret
      description: Same as `rotateCredential`, for a system client. **The new secret is in this response only.**
      security:
        - adminAuth: []
      responses:
        '200':
          description: The credentials, including the new secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /admin/system-credentials/{clientId}/revoke:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Admin]
      operationId: revokeSystemCredential
      summary: Stop a system client from calling CHOSEN
      description: Same as `revokeCredential`, for a system client. Takes effect immediately.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The revoked credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }

components:
  securitySchemes:
    tenantAuth:
      type: oauth2
      description: |
        A token for one of the tenant's client credentials, created in CHOSEN (`/credentials`).
        Kong and CHOSEN both check it; CHOSEN finds the tenant from the client ID (`azp`), and
        every call is limited to that tenant's data.

        The token URL is BC Gov SSO's `apigw` realm. It's shown here for PROD; DEV and TEST
        use the `dev.` and `test.` hostnames. The issue response gives the right one.
      flows:
        clientCredentials:
          tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token
          scopes: {}
    notifyAuth:
      type: oauth2
      description: |
        A token for Notify's own client credentials, which belong to the `NOTIFY` system role
        instead of a tenant (`/admin/system-credentials`). It may query recipients for any
        tenant, and the tenant is named in the request.
      flows:
        clientCredentials:
          tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token
          scopes: {}
    tenantUserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An IDIR user signed in to CHOSEN's UI, with BC Gov SSO's `standard` realm. The tenant is
        chosen with the `X-Tenant-Id` header, and the user must belong to it in CSTAR. Roles are
        the user's CSTAR roles for that tenant.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Notify-Signature
      description: |
        HMAC signature on the body of a webhook from Notify, made with the secret shared when
        CHOSEN's system-level webhook was registered. Required together with `notifyAuth`. The
        exact header and algorithm follow Notify's webhook delivery.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An IDIR user signed in to CHOSEN's UI, with BC Gov SSO's `standard` realm, who has the
        `CHOSEN_ADMIN` role.

  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: The CSTAR tenant ID the signed-in user is acting for.
      schema: { type: string }
    ClientId:
      name: clientId
      in: path
      required: true
      description: The client ID the API Services Portal issued.
      schema: { type: string, maxLength: 200 }
    TopicKey:
      name: topicKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TopicKey' }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicToken:
      name: token
      in: path
      required: true
      description: The token from the link.
      schema: { type: string, minLength: 20, maxLength: 512 }
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: The request isn't valid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in, but without the role this needs, or not a member of the tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CredentialRevoked:
      description: The credentials have been revoked.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CredentialIssuerFailed:
      description: The API Services Portal couldn't issue or rotate the credentials. Nothing was saved; try again later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or it belongs to another tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Too many requests for this address or from this client; try later.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidToken:
      description: The link isn't valid, has already been used, or has been cancelled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ExpiredToken:
      description: The link has expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ------------------------------------------------------------ Shared
    Channel:
      type: string
      enum: [EMAIL, SMS]
    Address:
      type: string
      maxLength: 320
      description: An email address, or a phone number. Phone numbers are normalised to E.164, e.g. `+12505550123`.
      examples: [person@example.com, '+12505550123']
    TopicKey:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The tenant's own name for the topic, unique within the tenant.
      examples: [road-closures]
    FilterFieldName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,62}$'
      examples: [region]
    Filters:
      type: object
      description: Filter field name to the values chosen. An empty array, or a field left out, matches anything.
      additionalProperties:
        type: array
        items: { type: string, maxLength: 200 }
      examples:
        - region: [victoria, nanaimo]
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array }
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; `null` on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ------------------------------------------------------------ Topics
    TopicStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    FilterField:
      type: object
      required: [name, dataType, matchType]
      properties:
        name: { $ref: '#/components/schemas/FilterFieldName' }
        label:
          type: string
          maxLength: 200
          description: Shown on the manage page.
        dataType:
          type: string
          enum: [TEXT]
          description: Phase 2 adds `NUMBER`.
        matchType:
          type: string
          enum: [EXACT]
          description: Phase 2 adds threshold matches (`MIN`, `MAX`).
        allowMultiple:
          type: boolean
          default: true
        required:
          type: boolean
          default: false
          description: Subscribers must choose at least one value.
        allowedValues:
          type: [array, 'null']
          items: { type: string, maxLength: 200 }
          description: If set, chosen values must come from this list.
    ConfirmationTemplate:
      type: object
      description: The confirmation message. Give either a Notify template ID or inline content.
      oneOf:
        - type: object
          required: [notifyTemplateId]
          properties:
            notifyTemplateId: { type: string }
          additionalProperties: false
        - type: object
          required: [inline]
          properties:
            inline:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                  maxLength: 200
                  description: Email only.
                body:
                  type: string
                  maxLength: 5000
                  description: |
                    Email: must include `((confirmUrl))`, where CHOSEN inserts the link.
                    SMS: must tell the person to reply `YES`, or `<keyword> YES`;
                    `((confirmUrl))` is optional.
          additionalProperties: false
    TopicChannelSettings:
      type: object
      properties:
        confirmationRequired:
          type: boolean
          default: true
          description: |
            Double opt-in for this channel. If `true`, new subscriptions on this channel stay
            `PENDING` until the person confirms (email: the link; SMS: a `YES` reply or the link),
            and expire after the topic's `pendingExpiryMinutes`. Changing it affects only new
            subscriptions.
        confirmationTemplate:
          description: Required when `confirmationRequired` is `true`.
          $ref: '#/components/schemas/ConfirmationTemplate'
        smsKeyword:
          type: [string, 'null']
          pattern: '^[A-Z0-9]{2,10}$'
          description: SMS only. Unique across CHOSEN. A subscriber texts `<keyword> YES` to confirm a pending subscription to this topic, and `<keyword> OFF` to unsubscribe from it.
          examples: [ROADS]
    TopicChannel:
      allOf:
        - type: object
          required: [channel]
          properties:
            channel: { $ref: '#/components/schemas/Channel' }
        - $ref: '#/components/schemas/TopicChannelSettings'
    TopicCreate:
      type: object
      required: [key, name, channels]
      properties:
        key: { $ref: '#/components/schemas/TopicKey' }
        name:
          type: string
          maxLength: 200
          description: Shown to subscribers.
        description: { type: string, maxLength: 2000 }
        pendingExpiryMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          default: 1440
          description: How long an unconfirmed subscription waits before it expires, on any channel that requires confirmation.
        redirectUrl:
          type: [string, 'null']
          format: uri
          description: Where the hosted pages send the person after they confirm or unsubscribe. If empty, CHOSEN shows its own page.
        channels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TopicChannel' }
        filterFields:
          type: array
          items: { $ref: '#/components/schemas/FilterField' }
    TopicUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        pendingExpiryMinutes: { type: integer, minimum: 5, maximum: 10080 }
        redirectUrl: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/TopicStatus' }
    Topic:
      allOf:
        - $ref: '#/components/schemas/TopicCreate'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/TopicStatus' }
            manageUrl:
              type: string
              format: uri
              description: The fixed "manage subscriptions" link for this topic, for use in templates.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    # ----------------------------------------------------- Subscriptions
    SubscriptionStatus:
      type: string
      enum: [PENDING, ACTIVE, UNSUBSCRIBED, EXPIRED]
    ConsentEvidence:
      type: object
      description: How the person agreed. Stored as consent evidence.
      required: [method, text]
      properties:
        method:
          type: string
          enum: [WEB_FORM, ASSISTED, API, IMPORT]
          description: |
            `WEB_FORM`: the person submitted the tenant's form.
            `ASSISTED`: staff subscribed them, e.g. by phone.
            `API`: another system subscribed them.
            `IMPORT`: moved from an older list; confirmation is still sent if the channel requires it.
        text:
          type: string
          maxLength: 5000
          description: The wording the person agreed to.
        capturedAt:
          type: string
          format: date-time
          description: When the person agreed. Defaults to the time of the request.
        sourceIp:
          type: string
          description: The person's IP address, if the tenant has it.
        userAgent: { type: string, maxLength: 500 }
        actor:
          type: string
          maxLength: 200
          description: Who acted, as recorded by the tenant, e.g. a staff user ID.
    SubscriptionCreate:
      type: object
      required: [channel, address, consent]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        address: { $ref: '#/components/schemas/Address' }
        externalSubjectId:
          type: string
          maxLength: 200
          description: The tenant's own ID for the person, e.g. a user ID or BCSC GUID. Stored, never resolved.
        filters: { $ref: '#/components/schemas/Filters' }
        consent: { $ref: '#/components/schemas/ConsentEvidence' }
    SubscriptionUpdate:
      type: object
      required: [filters]
      properties:
        filters: { $ref: '#/components/schemas/Filters' }
        actor: { type: string, maxLength: 200 }
    Subscription:
      type: object
      required: [id, topicKey, contactId, channel, address, status, filters, suppressed, createdAt]
      properties:
        id: { type: string, format: uuid }
        topicKey: { $ref: '#/components/schemas/TopicKey' }
        contactId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        address: { $ref: '#/components/schemas/Address' }
        externalSubjectId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        filters: { $ref: '#/components/schemas/Filters' }
        suppressed:
          type: boolean
          description: The address is suppressed, so it isn't returned as a recipient even if active.
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        unsubscribedAt: { type: [string, 'null'], format: date-time }
        pendingExpiresAt: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------- Contacts
    Contact:
      type: object
      required: [id, channel, address, suppressed]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        address: { $ref: '#/components/schemas/Address' }
        externalSubjectId: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        suppressed: { type: boolean }
        replacedBy:
          type: [string, 'null']
          format: uuid
          description: Set when the address was changed; the contact that took over the subscriptions.
    ContactWithSubscriptions:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          required: [subscriptions]
          properties:
            subscriptions:
              type: array
              items: { $ref: '#/components/schemas/Subscription' }

    # ------------------------------------------------------ Suppressions
    Suppression:
      type: object
      required: [id, channel, address, scope, suppressedAt]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        address:
          $ref: '#/components/schemas/Address'
          description: Shown from the tenant's matching contact; CHOSEN stores only a hash.
        sender: { type: [string, 'null'] }
        scope:
          type: string
          enum: [TENANT, SHARED]
          description: '`SHARED` suppressions apply to every tenant: SMS `STOP` and email hard bounces.'
        reason:
          type: [string, 'null']
          enum: [MANUAL, COMPLAINT, null]
          description: Only shown for the tenant's own suppressions.
        note: { type: [string, 'null'] }
        suppressedAt: { type: string, format: date-time }
        liftedAt: { type: [string, 'null'], format: date-time }

    # ----------------------------------------------------------- History
    ConsentEvent:
      type: object
      required: [id, subscriptionId, action, method, occurredAt]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        action:
          type: string
          enum: [OPT_IN, CONFIRM, EXPIRE, FILTERS_CHANGED, OPT_OUT, ADDRESS_CHANGED]
        method:
          type: string
          enum: [WEB_FORM, ASSISTED, API, IMPORT, CONFIRM_LINK, SMS_REPLY, UNSUBSCRIBE_LINK, ONE_CLICK, MANAGE_PAGE, SMS_KEYWORD, SYSTEM]
        text: { type: [string, 'null'] }
        actor: { type: [string, 'null'] }
        sourceIp: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        filters:
          description: The filters after the change, for `OPT_IN` and `FILTERS_CHANGED`.
          oneOf:
            - $ref: '#/components/schemas/Filters'
            - type: 'null'
        occurredAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, entityType, entityId, action, occurredAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string, enum: [CREATE, UPDATE, DELETE] }
        actor: { type: [string, 'null'] }
        changes:
          type: object
          description: Changed fields, each with `from` and `to`.
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
        occurredAt: { type: string, format: date-time }

    # -------------------------------------------------------- Recipients
    RecipientQuery:
      type: object
      required: [tenantId, topicKey, channel]
      properties:
        tenantId:
          type: string
          description: The CSTAR tenant ID that Notify is sending for.
        topicKey: { $ref: '#/components/schemas/TopicKey' }
        channel: { $ref: '#/components/schemas/Channel' }
        sender:
          type: string
          description: Required for SMS. The number Notify will send from, used to apply `STOP` suppressions.
          examples: ['+12505550100']
        filters:
          $ref: '#/components/schemas/Filters'
          description: The event's values. A subscriber matches if, for every field they chose values for, at least one is in this list.
        cursor: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
    Recipient:
      type: object
      required: [subscriptionId, channel, address, unsubscribeUrl]
      properties:
        subscriptionId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        address: { $ref: '#/components/schemas/Address' }
        externalSubjectId: { type: [string, 'null'] }
        unsubscribeUrl:
          type: string
          format: uri
          description: |
            Signed link for this recipient and topic. Put it in the message body, and for email also in
            `List-Unsubscribe: <unsubscribeUrl>` with `List-Unsubscribe-Post: List-Unsubscribe=One-Click`.
    RecipientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Recipient' }
        nextCursor: { type: [string, 'null'] }
        manageUrl:
          type: string
          format: uri
          description: The topic's fixed "manage subscriptions" link, for templates that can't use a link per recipient.

    # ----------------------------------------------------------- Inbound
    InboundSms:
      type: object
      required: [eventId, from, to, body, receivedAt]
      properties:
        eventId:
          type: string
          description: Notify's ID for this inbound message. Used to ignore repeat deliveries.
        from:
          type: string
          description: The person's phone number, in E.164.
        to:
          type: string
          description: The sender number or short code the text was sent to.
        body: { type: string, maxLength: 1600 }
        provider:
          type: string
          examples: [ACS, AWS, TWILIO]
        providerMessageId: { type: string }
        providerOptOutApplied:
          type: boolean
          description: The provider reports it has already opted the number out (or back in).
        receivedAt: { type: string, format: date-time }
    InboundSmsResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [STOP_APPLIED, START_APPLIED, KEYWORD_OPT_OUT, KEYWORD_NOT_SUBSCRIBED, CONFIRMED, CONFIRM_AMBIGUOUS, NOTHING_TO_CONFIRM, HELP_SENT, UNRECOGNISED, DUPLICATE]
          description: |
            `CONFIRMED`: a pending subscription became `ACTIVE`.
            `CONFIRM_AMBIGUOUS`: a plain `YES` matched several pending subscriptions; none was confirmed.
            `NOTHING_TO_CONFIRM`: a `YES` matched no pending subscription, e.g. it had expired.
        replySent:
          type: boolean
          description: CHOSEN sent a reply through Notify.
    DeliveryEvent:
      type: object
      required: [eventId, type, channel, address, occurredAt]
      properties:
        eventId: { type: string }
        type:
          type: string
          enum: [EMAIL_HARD_BOUNCE, EMAIL_COMPLAINT, SMS_OPTED_OUT]
        tenantId:
          type: string
          description: The CSTAR tenant ID the message was sent for. Required for `EMAIL_COMPLAINT`.
        channel: { $ref: '#/components/schemas/Channel' }
        address: { $ref: '#/components/schemas/Address' }
        sender:
          type: string
          description: Required for `SMS_OPTED_OUT`.
        subscriptionId:
          type: string
          format: uuid
          description: If Notify knows which subscription the message was sent for.
        occurredAt: { type: string, format: date-time }

    # ------------------------------------------------------------ Public
    PublicSubscriptionSummary:
      type: object
      required: [topicName, tenantName, channel, maskedAddress, status]
      properties:
        topicName: { type: string }
        topicDescription: { type: [string, 'null'] }
        tenantName: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        maskedAddress:
          type: string
          examples: ['p***n@example.com', '+1250***0123']
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
    PublicActionResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        redirectUrl:
          type: [string, 'null']
          format: uri
          description: The topic's redirect, if it has one; otherwise the page shows its own message.
    PublicManageView:
      type: object
      required: [tenantName, channel, maskedAddress, subscriptions]
      properties:
        tenantName: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        maskedAddress: { type: string }
        expiresAt: { type: string, format: date-time }
        subscriptions:
          type: array
          items:
            type: object
            required: [id, topicName, status, filters, filterFields]
            properties:
              id: { type: string, format: uuid }
              topicName: { type: string }
              topicDescription: { type: [string, 'null'] }
              status: { $ref: '#/components/schemas/SubscriptionStatus' }
              filters: { $ref: '#/components/schemas/Filters' }
              filterFields:
                type: array
                items: { $ref: '#/components/schemas/FilterField' }

    # ------------------------------------------------------- Credentials
    ApiClient:
      type: object
      required: [clientId, label, issuedAt, issuedBy]
      properties:
        clientId:
          type: string
          description: |
            Issued by the API Services Portal as `<environment appId>-<application appId>`.
            Tokens carry it as `azp`.
          examples: [D5C97345-4B7E21C09A6]
        label:
          type: string
          examples: [Road closures app (PROD)]
        systemRole:
          type: [string, 'null']
          enum: [NOTIFY, null]
          description: Set only on system credentials; tenant credentials have `null`.
        issuedBy: { type: string, description: Who created the credentials. }
        issuedAt: { type: string, format: date-time }
        rotatedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
    IssuedApiClient:
      description: Returned only when credentials are created or rotated.
      allOf:
        - $ref: '#/components/schemas/ApiClient'
        - type: object
          required: [clientSecret, tokenUrl]
          properties:
            clientSecret:
              type: string
              description: Shown once. CHOSEN doesn't store it and can't show it again.
            tokenUrl:
              type: string
              format: uri
              description: Where the service exchanges its client ID and secret for a token.
              examples: [https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token]
    ApiClientCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 100
          description: Tells the tenant's credentials apart, e.g. by app and environment.
          examples: [Road closures app (PROD)]
    SystemApiClientCreate:
      type: object
      required: [systemRole, label]
      properties:
        systemRole: { type: string, enum: [NOTIFY] }
        label: { type: string, maxLength: 100, examples: [Notify PROD] }

    # ------------------------------------------------------------- Admin
    Tenant:
      type: object
      required: [id, externalId, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
