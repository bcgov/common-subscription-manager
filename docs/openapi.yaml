openapi: 3.1.0
info:
  title: Common Hosted Subscription for Event Notifications (CHOSEN) API
  version: 0.1.0-draft
  summary: Manage subscribers, consent and opt-outs for notifications sent through Notify.
  description: |
    Draft for review.

    **Callers**

    | Caller | Authentication | Uses |
    |---|---|---|
    | A tenant's backend (e.g. a line-of-business app) | `tenantAuth` | Topics, subscriptions, contacts, suppressions, history |
    | Notify | `notifyAuth`; webhooks also need `webhookSignature` | Recipient lookup, inbound SMS, delivery events |
    | The public, through links CHOSEN sends | A token in the path | Confirm, unsubscribe, manage subscriptions |
    | Tenant staff, in CHOSEN's UI | `tenantUserAuth` | The tenant's client credentials |
    | CHOSEN operators | `adminAuth` | Tenants, Notify's client credentials |

    Services authenticate with OAuth2 client credentials that their tenant creates in CHOSEN
    (`/credentials`). CHOSEN has the API Services Portal issue them and links each client ID to
    the tenant. Every caller except the public reaches CHOSEN through the Kong API gateway, which
    checks the token and applies rate limits. CHOSEN then checks the token again and finds the
    tenant, or Notify, from its client ID (`azp`). Kong is the only way to the backend: CHOSEN's
    own UI and the public pages behind its links call the API through the gateway too, the public
    endpoints without credentials and rate-limited per IP address.

    **Conventions**

    - Every tenant endpoint only sees the calling tenant's data. An ID from another tenant returns `404`.
    - Lists use cursor pagination: pass `nextCursor` back as `cursor` until it's `null`.
    - Errors use `application/problem+json` (RFC 9457).
    - Addresses are normalised before they're stored or compared: phone numbers to E.164, emails trimmed and lower-cased.
    - Times are ISO 8601 in UTC.

    **MCP**

    Operations marked `x-mcp-tool` are also exposed as tools by CHOSEN's MCP layer, under that name. The REST operation is the source of truth for parameters and results.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /api/v1

tags:
  - name: Topics
    description: Things people can subscribe to, with their channels and filter fields.
  - name: Subscriptions
    description: Subscribe, change filters and unsubscribe.
  - name: Contacts
    description: 'The people subscribed to a tenant''s topics: each one an email address or phone number, with all of its subscriptions.'
  - name: Suppressions
    description: Addresses that must not be sent to.
  - name: History
    description: Consent evidence and audit trail.
  - name: Recipients
    description: Called by Notify when it sends.
  - name: Inbound
    description: Webhooks from Notify for inbound SMS and delivery events.
  - name: Public
    description: Called by CHOSEN's hosted pages and by mail clients. Authorised by the token in the link.
  - name: Credentials
    description: 'For tenant staff in CHOSEN''s UI: create and manage the client ID and secret their apps use to call CHOSEN. CHOSEN stores the client ID, never the secret.'
  - name: Admin
    description: CHOSEN operators.

security:
  - tenantAuth: []

paths:
  # ---------------------------------------------------------------- Topics
  /topics:
    get:
      tags: [Topics]
      operationId: listTopics
      summary: List the tenant's topics
      x-mcp-tool: list_topics
      parameters:
        - name: status
          in: query
          description: Only topics with this status. Leave it out for all.
          schema: { $ref: '#/components/schemas/TopicStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of topics.
          content:
            application/json:
              examples:
                topicPage: { $ref: '#/components/examples/TopicPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Topics]
      operationId: createTopic
      summary: Create a topic
      description: |
        Creates a topic with its channels and filter fields.
        Each channel's `smsKeyword` must be unique across CHOSEN and must not be a system keyword
        (`STOP`, `START`, `HELP`, `INFO`, `YES`) or a provider's reserved opt-out word.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              topicCreate: { $ref: '#/components/examples/TopicCreate' }
            schema: { $ref: '#/components/schemas/TopicCreate' }
      responses:
        '201':
          description: The topic was created.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The `key` is already used by this tenant, or an `smsKeyword` is already taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'The SMS keyword ROADS is already used by another topic.'

  /topics/{topicKey}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    get:
      tags: [Topics]
      operationId: getTopic
      summary: Get a topic
      x-mcp-tool: get_topic
      responses:
        '200':
          description: The topic.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Topics]
      operationId: updateTopic
      summary: Update a topic's settings
      description: |
        Changes top-level settings. Channels and filter fields have their own endpoints.
        Setting `status` to `ARCHIVED` stops the topic being offered and returned by recipient queries;
        its subscriptions and history are kept.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              topicUpdate: { $ref: '#/components/examples/TopicUpdate' }
              topicArchive: { $ref: '#/components/examples/TopicArchive' }
            schema: { $ref: '#/components/schemas/TopicUpdate' }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topicKey}/channels/{channel}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
      - name: channel
        in: path
        required: true
        description: The channel to add, replace or remove.
        schema: { $ref: '#/components/schemas/Channel' }
        example: SMS
    put:
      tags: [Topics]
      operationId: putTopicChannel
      summary: Add or replace a channel on a topic
      requestBody:
        required: true
        content:
          application/json:
            examples:
              topicChannelSms: { $ref: '#/components/examples/TopicChannelSms' }
              topicChannelEmail: { $ref: '#/components/examples/TopicChannelEmail' }
            schema: { $ref: '#/components/schemas/TopicChannelSettings' }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The `smsKeyword` is already taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'The SMS keyword ROADS is already used by another topic.'
    delete:
      tags: [Topics]
      operationId: deleteTopicChannel
      summary: Stop offering a channel on a topic
      description: Refused while the topic has active or pending subscriptions on this channel.
      responses:
        '204': { description: The channel was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still use this channel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: '12 active or pending subscriptions still use the SMS channel.'

  /topics/{topicKey}/filter-fields:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    post:
      tags: [Topics]
      operationId: addFilterField
      summary: Add a filter field to a topic
      description: |
        Existing subscriptions have no values for a new field, so they match any value of it.
        A new field can't be `required` while the topic has subscriptions.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              filterFieldCreate: { $ref: '#/components/examples/FilterFieldCreate' }
            schema: { $ref: '#/components/schemas/FilterField' }
      responses:
        '201':
          description: The updated topic.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A field with this name already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'The topic already has a filter field named highway.'

  /topics/{topicKey}/filter-fields/{fieldName}:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
      - name: fieldName
        in: path
        required: true
        description: The filter field's `name`.
        schema: { $ref: '#/components/schemas/FilterFieldName' }
        example: region
    patch:
      tags: [Topics]
      operationId: updateFilterField
      summary: Change a filter field's label or allowed values
      description: Removing an allowed value that subscriptions still use is refused.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              filterFieldUpdate: { $ref: '#/components/examples/FilterFieldUpdate' }
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                allowedValues:
                  type: [array, 'null']
                  items: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              examples:
                topic: { $ref: '#/components/examples/Topic' }
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still use a value being removed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: "Subscriptions still use the value nanaimo, so it can't be removed."
    delete:
      tags: [Topics]
      operationId: deleteFilterField
      summary: Remove a filter field
      description: Refused while any subscription has values for the field.
      responses:
        '204': { description: The field was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Subscriptions still have values for this field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: '34 subscriptions still have values for highway.'

  # ---------------------------------------------------------- Subscriptions
  /topics/{topicKey}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/TopicKey'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: List a topic's subscriptions
      parameters:
        - name: status
          in: query
          description: Only subscriptions with this status. Leave it out for all.
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        - name: channel
          in: query
          description: Only this channel. Leave it out for both.
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          description: Only this email address or phone number. Exact match only; addresses are stored encrypted.
          schema: { type: string }
          example: '+12505550123'
        - name: externalSubjectId
          in: query
          description: Only subscriptions with this tenant ID for the person. Exact match only.
          schema: { type: string }
          example: 4f7a2c9e1b3d5f6a8c0e2b4d6f8a1c3e
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions.
          content:
            application/json:
              examples:
                subscriptionPage: { $ref: '#/components/examples/SubscriptionPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Subscriptions]
      operationId: subscribe
      summary: Subscribe an address to a topic
      x-mcp-tool: subscribe
      description: |
        Finds or creates the contact for the address, then the subscription.

        - If the topic's channel requires confirmation (double opt-in), the subscription is `PENDING` and
          CHOSEN sends a confirmation message through Notify. By email, the person confirms with the
          link. By SMS, they reply `YES` (or `<keyword> YES`), or use the link if the message has
          one. Otherwise the subscription is `ACTIVE` straight away.
        - If the address already has an `ACTIVE` or `PENDING` subscription to the topic, nothing
          changes and the existing subscription is returned with `200`. Use `updateSubscription`
          to change filters.
        - If the subscription was `UNSUBSCRIBED` or `EXPIRED`, it is subscribed again with the new
          consent and filters, and `201` is returned.
        - A suppressed address can still subscribe; `suppressed` is `true` in the response and it
          won't be returned as a recipient until the suppression is lifted.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              subscribeSms: { $ref: '#/components/examples/SubscribeSms' }
              subscribeEmailAssisted: { $ref: '#/components/examples/SubscribeEmailAssisted' }
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '200':
          description: Already subscribed; nothing changed.
          content:
            application/json:
              examples:
                subscriptionActive: { $ref: '#/components/examples/SubscriptionActive' }
              schema: { $ref: '#/components/schemas/Subscription' }
        '201':
          description: Subscribed, or subscribed again.
          content:
            application/json:
              examples:
                subscriptionPending: { $ref: '#/components/examples/SubscriptionPending' }
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The topic doesn't offer this channel, the topic is archived, or the filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: "squamish isn't an allowed value for region."

  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Get a subscription
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              examples:
                subscriptionActive: { $ref: '#/components/examples/SubscriptionActive' }
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: Change a subscription's filter values
      x-mcp-tool: update_subscription_filters
      description: |
        Replaces the filter values. A field left out of `filters` keeps its values; a field set to
        an empty array matches anything. Recorded as a `FILTERS_CHANGED` consent event.
        Only `PENDING` and `ACTIVE` subscriptions can be changed.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              subscriptionUpdate: { $ref: '#/components/examples/SubscriptionUpdate' }
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: The updated subscription.
          content:
            application/json:
              examples:
                subscriptionUpdated: { $ref: '#/components/examples/SubscriptionUpdated' }
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription is unsubscribed or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: "The subscription is unsubscribed, so its filters can't be changed."
        '422':
          description: The filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: "squamish isn't an allowed value for region."

  /subscriptions/{subscriptionId}/unsubscribe:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Subscriptions]
      operationId: unsubscribe
      summary: Unsubscribe from the topic
      x-mcp-tool: unsubscribe
      description: |
        Sets the subscription to `UNSUBSCRIBED` and cancels its unsubscribe links.
        Unsubscribing an already unsubscribed subscription returns it unchanged.
      requestBody:
        content:
          application/json:
            examples:
              unsubscribeRequest: { $ref: '#/components/examples/UnsubscribeRequest' }
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                actor:
                  type: string
                  maxLength: 200
                  description: Who asked, as recorded by the tenant, e.g. a staff user ID.
      responses:
        '200':
          description: The subscription, now unsubscribed.
          content:
            application/json:
              examples:
                subscriptionUnsubscribed: { $ref: '#/components/examples/SubscriptionUnsubscribed' }
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions/{subscriptionId}/resend-confirmation:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Subscriptions]
      operationId: resendConfirmation
      summary: Send the confirmation message again
      description: Issues a new confirmation link, cancels the previous one, and restarts the pending expiry.
      responses:
        '202': { description: The confirmation message was queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription isn't pending.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'The subscription is already active.'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --------------------------------------------------------------- Contacts
  /contacts:
    get:
      tags: [Contacts]
      operationId: findContacts
      summary: Find contacts by address or external subject ID
      description: Exact matches only. At least one of `address` or `externalSubjectId` is required.
      parameters:
        - name: channel
          in: query
          description: Only this channel. Leave it out for both.
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          description: The email address or phone number to look for. Exact match only.
          schema: { type: string }
          example: '+12505550123'
        - name: externalSubjectId
          in: query
          description: The tenant's own ID for the person. Exact match only.
          schema: { type: string }
          example: 4f7a2c9e1b3d5f6a8c0e2b4d6f8a1c3e
      responses:
        '200':
          description: Matching contacts; usually one or none.
          content:
            application/json:
              examples:
                contactList: { $ref: '#/components/examples/ContactList' }
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact and all its subscriptions
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              examples:
                contactWithSubscriptions: { $ref: '#/components/examples/ContactWithSubscriptions' }
              schema: { $ref: '#/components/schemas/ContactWithSubscriptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contacts/{contactId}/change-address:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      operationId: changeContactAddress
      summary: Start changing a contact's address
      description: |
        Creates a new, unverified contact for the new address and sends it a verification message.
        When it's verified, the old contact's `ACTIVE` and `PENDING` subscriptions move to the new
        contact, keeping their filters, and the old contact is retired. Until then, messages keep
        going to the old address.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              changeAddress: { $ref: '#/components/examples/ChangeAddress' }
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: '#/components/schemas/Address' }
                actor: { type: string, maxLength: 200 }
      responses:
        '202':
          description: Verification sent to the new address.
          content:
            application/json:
              examples:
                contactUnverified: { $ref: '#/components/examples/ContactUnverified' }
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another contact of this tenant already has the new address.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'Another contact already has the address +12505550188.'

  /contacts/{contactId}/unsubscribe-all:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      operationId: unsubscribeContactFromAll
      summary: Unsubscribe a contact from all of the tenant's topics
      requestBody:
        content:
          application/json:
            examples:
              unsubscribeAllRequest: { $ref: '#/components/examples/UnsubscribeAllRequest' }
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                actor: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The contact and its subscriptions, now unsubscribed.
          content:
            application/json:
              examples:
                contactUnsubscribedFromAll: { $ref: '#/components/examples/ContactUnsubscribedFromAll' }
              schema: { $ref: '#/components/schemas/ContactWithSubscriptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- Suppressions
  /suppressions:
    get:
      tags: [Suppressions]
      operationId: listSuppressions
      summary: List suppressions that affect the tenant's contacts
      description: |
        Includes the tenant's own suppressions and shared ones (SMS `STOP`, email hard bounces) that
        match one of its contacts. The reason for a shared suppression isn't shown.
      parameters:
        - name: channel
          in: query
          description: Only this channel. Leave it out for both.
          schema: { $ref: '#/components/schemas/Channel' }
        - name: address
          in: query
          description: Only suppressions of this email address or phone number. Exact match only.
          schema: { type: string }
          example: person@example.com
        - name: active
          in: query
          description: Only suppressions that haven't been lifted. Defaults to `true`.
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of suppressions.
          content:
            application/json:
              examples:
                suppressionPage: { $ref: '#/components/examples/SuppressionPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Suppression' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Suppressions]
      operationId: createSuppression
      summary: Suppress an address for this tenant
      requestBody:
        required: true
        content:
          application/json:
            examples:
              suppressionCreate: { $ref: '#/components/examples/SuppressionCreate' }
            schema:
              type: object
              required: [channel, address]
              properties:
                channel: { $ref: '#/components/schemas/Channel' }
                address: { $ref: '#/components/schemas/Address' }
                sender:
                  type: string
                  description: SMS only. Limit the suppression to one sender number.
                note: { type: string, maxLength: 500 }
                actor: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The suppression.
          content:
            application/json:
              examples:
                suppression: { $ref: '#/components/examples/Suppression' }
              schema: { $ref: '#/components/schemas/Suppression' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /suppressions/{suppressionId}/lift:
    parameters:
      - name: suppressionId
        in: path
        required: true
        description: The suppression's ID, from `listSuppressions`.
        schema: { type: string, format: uuid }
        example: 5a3c1e9f-7b2d-4d6e-8f40-2b4d6f8a0c17
    post:
      tags: [Suppressions]
      operationId: liftSuppression
      summary: Lift one of the tenant's suppressions
      description: |
        Only the tenant's own suppressions (manual or spam complaint) can be lifted.
        A shared SMS `STOP` is only lifted by the person texting `START`.
      responses:
        '200':
          description: The suppression, now lifted.
          content:
            application/json:
              examples:
                suppressionLifted: { $ref: '#/components/examples/SuppressionLifted' }
              schema: { $ref: '#/components/schemas/Suppression' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A shared suppression can't be lifted by a tenant.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: 'A shared STOP can only be lifted by the person texting START.'
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- History
  /subscriptions/{subscriptionId}/consent-events:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [History]
      operationId: listConsentEvents
      summary: Consent history of a subscription
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Consent events, oldest first.
          content:
            application/json:
              examples:
                consentEventPage: { $ref: '#/components/examples/ConsentEventPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConsentEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-events:
    get:
      tags: [History]
      operationId: listAuditEvents
      summary: Changes to the tenant's topics and settings
      parameters:
        - name: entityType
          in: query
          description: Only changes to this kind of thing.
          schema: { type: string, enum: [TOPIC, TOPIC_CHANNEL, FILTER_FIELD, SUPPRESSION, TENANT] }
        - name: entityId
          in: query
          description: Only changes to the thing with this ID, such as one topic.
          schema: { type: string, format: uuid }
          example: 3f2b8c1e-6d4a-4f7e-9b21-5a8c0d7e4f10
        - name: from
          in: query
          description: Only changes at or after this time.
          schema: { type: string, format: date-time }
          example: '2026-11-01T00:00:00Z'
        - name: to
          in: query
          description: Only changes before this time.
          schema: { type: string, format: date-time }
          example: '2026-12-01T00:00:00Z'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events, newest first.
          content:
            application/json:
              examples:
                auditEventPage: { $ref: '#/components/examples/AuditEventPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- Recipients
  /recipients/query:
    post:
      tags: [Recipients]
      operationId: queryRecipients
      summary: Get the recipients for a send
      x-mcp-tool: get_recipients
      security:
        - notifyAuth: []
      description: |
        Called by Notify when it sends to a topic. Returns contacts that:

        1. have an `ACTIVE` subscription to the topic on `channel`;
        2. for every filter field where the subscriber chose values, chose at least one of the
           values in `filters`; and
        3. aren't suppressed. For SMS, that's no suppression for `sender`, shared or the tenant's
           own. For email, no shared suppression and none of the tenant's own.

        A filter field left out of `filters` doesn't restrict anything. Results are in a stable
        order; page through with `cursor`. A cursor is valid for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              recipientQuery: { $ref: '#/components/examples/RecipientQuery' }
            schema: { $ref: '#/components/schemas/RecipientQuery' }
      responses:
        '200':
          description: A page of recipients.
          content:
            application/json:
              examples:
                recipientPage: { $ref: '#/components/examples/RecipientPage' }
              schema: { $ref: '#/components/schemas/RecipientPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The topic doesn't offer this channel, the topic is archived, or a filter field isn't one of the topic's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: "The topic road-closures doesn't have a filter field named district."

  # ---------------------------------------------------------------- Inbound
  /inbound/sms:
    post:
      tags: [Inbound]
      operationId: receiveInboundSms
      summary: An SMS reply received by Notify
      security:
        - notifyAuth: []
          webhookSignature: []
      description: |
        Notify receives the text from the provider and forwards it here. CHOSEN handles:

        | Text | What CHOSEN does |
        |---|---|
        | `STOP` (and the provider's other opt-out words) | Suppresses `from` for `to`, for every tenant. The provider has already blocked the number and sent its own reply. |
        | `START` | Lifts that suppression. Subscriptions resume as they were. |
        | `<keyword> OFF`, e.g. `ROADS OFF` | Unsubscribes `from` from that topic, and replies through Notify. |
        | `<keyword> YES`, e.g. `ROADS YES` | Confirms `from`'s pending subscription to that topic. |
        | `YES` | Confirms `from`'s pending subscription whose confirmation was sent from `to`. If there are several, nothing is confirmed and CHOSEN replies asking for `<keyword> YES`. |
        | `HELP`, `INFO` | Replies through Notify with general help and a link to manage subscriptions. |
        | Anything else | Records it as `UNRECOGNISED`; no reply. |

        Idempotent on `eventId`: a repeat delivery returns the first outcome and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              inboundSmsKeywordOff: { $ref: '#/components/examples/InboundSmsKeywordOff' }
              inboundSmsStop: { $ref: '#/components/examples/InboundSmsStop' }
            schema: { $ref: '#/components/schemas/InboundSms' }
      responses:
        '200':
          description: The text was processed.
          content:
            application/json:
              examples:
                inboundSmsResultKeywordOff: { $ref: '#/components/examples/InboundSmsResultKeywordOff' }
                inboundSmsResultStop: { $ref: '#/components/examples/InboundSmsResultStop' }
              schema: { $ref: '#/components/schemas/InboundSmsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inbound/delivery-events:
    post:
      tags: [Inbound]
      operationId: receiveDeliveryEvent
      summary: A delivery outcome from Notify that affects who can be contacted
      security:
        - notifyAuth: []
          webhookSignature: []
      description: |
        | `type` | What CHOSEN does |
        |---|---|
        | `EMAIL_HARD_BOUNCE` | Suppresses the address for every tenant. |
        | `EMAIL_COMPLAINT` | Suppresses the address for `tenantId` only. |
        | `SMS_OPTED_OUT` | The provider refused to send because the number had opted out (e.g. Twilio error 21610). Suppresses it for `sender`, in case CHOSEN missed the `STOP`. |

        Idempotent on `eventId`.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              deliveryEventHardBounce: { $ref: '#/components/examples/DeliveryEventHardBounce' }
              deliveryEventComplaint: { $ref: '#/components/examples/DeliveryEventComplaint' }
            schema: { $ref: '#/components/schemas/DeliveryEvent' }
      responses:
        '204': { description: The event was processed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Public
  /public/confirmations/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getConfirmation
      summary: Show what a confirmation link is for
      description: |
        Used by the hosted confirmation page. Viewing doesn't confirm: mail scanners open links,
        so confirming needs the `POST`.
      security: []
      responses:
        '200':
          description: What the person is confirming.
          content:
            application/json:
              examples:
                publicSummaryPending: { $ref: '#/components/examples/PublicSummaryPending' }
              schema: { $ref: '#/components/schemas/PublicSubscriptionSummary' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }
    post:
      tags: [Public]
      operationId: confirmSubscription
      summary: Confirm a pending subscription
      security: []
      responses:
        '200':
          description: The subscription is active.
          content:
            application/json:
              examples:
                publicConfirmed: { $ref: '#/components/examples/PublicConfirmed' }
              schema: { $ref: '#/components/schemas/PublicActionResult' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  /public/unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getUnsubscribe
      summary: Show what an unsubscribe link is for
      description: Used by the hosted unsubscribe page. Viewing doesn't unsubscribe.
      security: []
      responses:
        '200':
          description: The subscription the link belongs to.
          content:
            application/json:
              examples:
                publicSummaryActive: { $ref: '#/components/examples/PublicSummaryActive' }
              schema: { $ref: '#/components/schemas/PublicSubscriptionSummary' }
        '404': { $ref: '#/components/responses/InvalidToken' }
    post:
      tags: [Public]
      operationId: unsubscribeByLink
      summary: Unsubscribe from one topic
      description: |
        Called by the hosted page (JSON) and by mail clients' one-click unsubscribe (RFC 8058),
        which posts the form body `List-Unsubscribe=One-Click` to the URL in the
        `List-Unsubscribe` header. The token is signed, not stored; it stops working once the
        subscription's links are cancelled.
      security: []
      requestBody:
        content:
          application/json:
            example:
              reason: Too many alerts for areas I don't drive through
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Why the person unsubscribed, if the page asked. Stored with the consent event.
          application/x-www-form-urlencoded:
            example:
              List-Unsubscribe: One-Click
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
                  description: Sent by mail clients for one-click unsubscribe (RFC 8058).
      responses:
        '200':
          description: Unsubscribed, or already unsubscribed.
          content:
            application/json:
              examples:
                publicUnsubscribed: { $ref: '#/components/examples/PublicUnsubscribed' }
              schema: { $ref: '#/components/schemas/PublicActionResult' }
        '404': { $ref: '#/components/responses/InvalidToken' }

  /public/topics/{topicId}/manage-link:
    parameters:
      - name: topicId
        in: path
        required: true
        description: The topic's ID, which is what the fixed "manage subscriptions" link in a template carries.
        schema: { type: string, format: uuid }
        example: 3f2b8c1e-6d4a-4f7e-9b21-5a8c0d7e4f10
    post:
      tags: [Public]
      operationId: requestManageLink
      summary: Send a sign-in link to manage subscriptions
      description: |
        If the address belongs to a contact of the topic's tenant, CHOSEN sends it a sign-in link.
        The response is the same either way, so it can't be used to find out who is subscribed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              manageLinkRequest: { $ref: '#/components/examples/ManageLinkRequest' }
            schema:
              type: object
              required: [channel, address]
              properties:
                channel: { $ref: '#/components/schemas/Channel' }
                address: { $ref: '#/components/schemas/Address' }
      responses:
        '202': { description: If the address is known, a sign-in link was sent. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/manage/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      tags: [Public]
      operationId: getManagedSubscriptions
      summary: The signed-in person's subscriptions with this tenant
      description: The sign-in token can be used repeatedly until it expires, 30 minutes after it's issued.
      security: []
      responses:
        '200':
          description: The person's subscriptions, with each topic's filter fields so the page can offer choices.
          content:
            application/json:
              examples:
                publicManageView: { $ref: '#/components/examples/PublicManageView' }
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  /public/manage/{token}/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/SubscriptionId'
    patch:
      tags: [Public]
      operationId: updateManagedSubscription
      summary: Change filter values on one of the signed-in person's subscriptions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              publicFiltersUpdate: { $ref: '#/components/examples/PublicFiltersUpdate' }
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: The updated view.
          content:
            application/json:
              examples:
                publicManageViewUpdated: { $ref: '#/components/examples/PublicManageViewUpdated' }
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }
        '422':
          description: The filters don't fit the topic's filter fields.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: "squamish isn't an allowed value for region."

  /public/manage/{token}/subscriptions/{subscriptionId}/unsubscribe:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Public]
      operationId: unsubscribeManagedSubscription
      summary: Unsubscribe the signed-in person from one topic
      security: []
      responses:
        '200':
          description: The updated view.
          content:
            application/json:
              examples:
                publicManageViewUnsubscribed: { $ref: '#/components/examples/PublicManageViewUnsubscribed' }
              schema: { $ref: '#/components/schemas/PublicManageView' }
        '404': { $ref: '#/components/responses/InvalidToken' }
        '410': { $ref: '#/components/responses/ExpiredToken' }

  # ------------------------------------------------------------ Credentials
  /credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List the tenant's client credentials
      description: Includes revoked credentials, newest first. Secrets are never returned here.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: includeRevoked
          in: query
          description: Include credentials that have been revoked.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The tenant's credentials.
          content:
            application/json:
              examples:
                apiClientList: { $ref: '#/components/examples/ApiClientList' }
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      operationId: issueCredential
      summary: Create client credentials for the tenant
      description: |
        CHOSEN has the API Services Portal issue a consumer for CHOSEN's gateway, then links its
        client ID to the tenant. **The client secret is in this response only.** CHOSEN doesn't
        store it; if it's lost, rotate the credentials.

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              apiClientCreate: { $ref: '#/components/examples/ApiClientCreate' }
            schema: { $ref: '#/components/schemas/ApiClientCreate' }
      responses:
        '201':
          description: The credentials, including the secret.
          content:
            application/json:
              examples:
                issuedApiClient: { $ref: '#/components/examples/IssuedApiClient' }
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /credentials/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Credentials]
      operationId: rotateCredential
      summary: Replace the client secret
      description: |
        The API Services Portal issues a new secret for the same client ID; the old secret stops
        working. Tokens already issued with the old secret keep working until they expire, within
        minutes. **The new secret is in this response only.**

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The credentials, including the new secret.
          content:
            application/json:
              examples:
                rotatedApiClient: { $ref: '#/components/examples/RotatedApiClient' }
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /credentials/{clientId}/revoke:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Credentials]
      operationId: revokeCredential
      summary: Stop the credentials from calling CHOSEN
      description: |
        Takes effect immediately: CHOSEN refuses tokens for this client ID from now on, even ones
        that haven't expired. It can't be undone; create new credentials instead.

        The API Services Portal can't delete the consumer through its API yet, so it stays listed
        on the portal's Consumers page until removed there by hand.

        Requires the `CHOSEN_OPERATIONS_ADMIN` role for the tenant.
      security:
        - tenantUserAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The revoked credentials.
          content:
            application/json:
              examples:
                revokedApiClient: { $ref: '#/components/examples/RevokedApiClient' }
              schema: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }

  # ------------------------------------------------------------------ Admin
  /admin/tenants:
    get:
      tags: [Admin]
      operationId: listTenants
      summary: List tenants
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tenants.
          content:
            application/json:
              examples:
                tenantPage: { $ref: '#/components/examples/TenantPage' }
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      operationId: createTenant
      summary: Register a tenant
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              tenantCreate: { $ref: '#/components/examples/TenantCreate' }
            schema:
              type: object
              required: [externalId, name, slug]
              properties:
                externalId:
                  type: string
                  description: The CSTAR tenant ID, the same one Notify uses.
                name: { type: string, maxLength: 200 }
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      responses:
        '201':
          description: The tenant.
          content:
            application/json:
              examples:
                tenant: { $ref: '#/components/examples/Tenant' }
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The `externalId` or `slug` is already registered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 'A tenant with the slug road-conditions is already registered.'

  /admin/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: CHOSEN's ID for the tenant (`id`, not the CSTAR `externalId`).
        schema: { type: string, format: uuid }
        example: 5b1e8f3a-2c47-4d9e-a613-0f8d2b7c9e14
    patch:
      tags: [Admin]
      operationId: updateTenant
      summary: Rename, suspend or reactivate a tenant
      description: A suspended tenant's API calls are refused and its topics return no recipients.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              tenantSuspend: { $ref: '#/components/examples/TenantSuspend' }
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              examples:
                tenantSuspended: { $ref: '#/components/examples/TenantSuspended' }
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/system-credentials:
    get:
      tags: [Admin]
      operationId: listSystemCredentials
      summary: List client credentials for systems, such as Notify
      security:
        - adminAuth: []
      parameters:
        - name: includeRevoked
          in: query
          description: Include credentials that have been revoked.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The system credentials.
          content:
            application/json:
              examples:
                systemApiClientList: { $ref: '#/components/examples/SystemApiClientList' }
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: issueSystemCredential
      summary: Create client credentials for a system, such as Notify
      description: |
        Like `issueCredential`, but the credentials belong to a system role instead of a tenant.
        A `NOTIFY` client can call the recipient and inbound endpoints for any tenant.
        **The client secret is in this response only.**
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              systemApiClientCreate: { $ref: '#/components/examples/SystemApiClientCreate' }
            schema: { $ref: '#/components/schemas/SystemApiClientCreate' }
      responses:
        '201':
          description: The credentials, including the secret.
          content:
            application/json:
              examples:
                issuedSystemApiClient: { $ref: '#/components/examples/IssuedSystemApiClient' }
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /admin/system-credentials/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Admin]
      operationId: rotateSystemCredential
      summary: Replace a system client's secret
      description: Same as `rotateCredential`, for a system client. **The new secret is in this response only.**
      security:
        - adminAuth: []
      responses:
        '200':
          description: The credentials, including the new secret.
          content:
            application/json:
              examples:
                rotatedSystemApiClient: { $ref: '#/components/examples/RotatedSystemApiClient' }
              schema: { $ref: '#/components/schemas/IssuedApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }
        '502': { $ref: '#/components/responses/CredentialIssuerFailed' }

  /admin/system-credentials/{clientId}/revoke:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Admin]
      operationId: revokeSystemCredential
      summary: Stop a system client from calling CHOSEN
      description: Same as `revokeCredential`, for a system client. Takes effect immediately.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The revoked credentials.
          content:
            application/json:
              examples:
                revokedSystemApiClient: { $ref: '#/components/examples/RevokedSystemApiClient' }
              schema: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialRevoked' }

components:
  securitySchemes:
    tenantAuth:
      type: oauth2
      description: |
        A token for one of the tenant's client credentials, created in CHOSEN (`/credentials`).
        Kong and CHOSEN both check it; CHOSEN finds the tenant from the client ID (`azp`), and
        every call is limited to that tenant's data.

        The token URL is BC Gov SSO's `apigw` realm. It's shown here for PROD; DEV and TEST
        use the `dev.` and `test.` hostnames. The issue response gives the right one.
      flows:
        clientCredentials:
          tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token
          scopes: {}
    notifyAuth:
      type: oauth2
      description: |
        A token for Notify's own client credentials, which belong to the `NOTIFY` system role
        instead of a tenant (`/admin/system-credentials`). It may query recipients for any
        tenant, and the tenant is named in the request.
      flows:
        clientCredentials:
          tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token
          scopes: {}
    tenantUserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An IDIR user signed in to CHOSEN's UI, with BC Gov SSO's `standard` realm. The tenant is
        chosen with the `X-Tenant-Id` header, and the user must belong to it in CSTAR. Roles are
        the user's CSTAR roles for that tenant.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Notify-Signature
      description: |
        HMAC signature on the body of a webhook from Notify, made with the secret shared when
        CHOSEN's system-level webhook was registered. Required together with `notifyAuth`. The
        exact header and algorithm follow Notify's webhook delivery.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An IDIR user signed in to CHOSEN's UI, with BC Gov SSO's `standard` realm, who has the
        `CHOSEN_ADMIN` role.

  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: The CSTAR tenant ID the signed-in user is acting for.
      schema: { type: string }
      example: c3a7e1d2-8f45-4b6a-9c02-7e1f3d5a8b60
    ClientId:
      name: clientId
      in: path
      required: true
      description: The client ID the API Services Portal issued.
      schema: { type: string, maxLength: 200 }
      example: D5C97345-4B7E21C09A6
    TopicKey:
      name: topicKey
      in: path
      required: true
      description: The topic's `key`, as the tenant chose it when creating the topic.
      schema: { $ref: '#/components/schemas/TopicKey' }
      example: road-closures
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: The subscription's ID, as returned when it was created.
      schema: { type: string, format: uuid }
      example: 7c9e2a41-0b3d-4e6f-8a15-2d4c6b8e0f31
    ContactId:
      name: contactId
      in: path
      required: true
      description: The contact's ID, as returned in a subscription's `contactId`.
      schema: { type: string, format: uuid }
      example: b41d7e92-5c3a-4a8b-9e06-1f2a3c4d5e6f
    PublicToken:
      name: token
      in: path
      required: true
      description: The signed token from the link CHOSEN sent.
      schema: { type: string, minLength: 20, maxLength: 512 }
      example: v1.N2M5ZTJhNDEtMGIzZC00ZTZm.kX3pQ8sZbR2mT7vW1yC4nF6hJ9
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page. Leave it out for the first page.
      schema: { type: string }
      example: eyJhZnRlciI6IjFhNGY2YzhlLTNiNWQifQ
    Limit:
      name: limit
      in: query
      description: The most items to return in one page.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: The request isn't valid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "The request body isn't valid."
            instance: /api/v1/topics
            errors:
              - field: 'channels[1].smsKeyword'
                message: must be 2 to 10 capital letters or digits
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: "The access token has expired."
    Forbidden:
      description: Signed in, but without the role this needs, or not a member of the tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "You need the CHOSEN_OPERATIONS_ADMIN role for this tenant."
    CredentialRevoked:
      description: The credentials have been revoked.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: "These credentials were revoked on 2026-10-20."
    CredentialIssuerFailed:
      description: The API Services Portal couldn't issue or rotate the credentials. Nothing was saved; try again later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Gateway
            status: 502
            detail: "The API Services Portal didn't respond. Nothing was saved; try again later."
    NotFound:
      description: Not found, or it belongs to another tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: "No topic with the key road-closures."
            instance: /api/v1/topics/road-closures
    TooManyRequests:
      description: Too many requests for this address or from this client; try later.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: "Too many confirmation messages for this address. Try again in 10 minutes."
    InvalidToken:
      description: The link isn't valid, has already been used, or has been cancelled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: "This link isn't valid, or has already been used."
    ExpiredToken:
      description: The link has expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Gone
            status: 410
            detail: "This link has expired."

