  schemas:
    # ------------------------------------------------------------ Shared
    Channel:
      type: string
      enum: [EMAIL, SMS]
      description: How a message is delivered.
    Address:
      type: string
      maxLength: 320
      description: An email address, or a phone number. Phone numbers are normalised to E.164, e.g. `+12505550123`.
      examples: [person@example.com, '+12505550123']
    TopicKey:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The tenant's own name for the topic, unique within the tenant.
      examples: [road-closures]
    FilterFieldName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,62}$'
      description: A filter field's name, used as its key in `filters`.
      examples: [region]
    Filters:
      type: object
      description: Filter field name to the values chosen. An empty array, or a field left out, matches anything.
      additionalProperties:
        type: array
        items: { type: string, maxLength: 200 }
      examples:
        - region: [victoria, nanaimo]
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The results on this page.
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; `null` on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem. `about:blank` when the status code says enough.
        title:
          type: string
          description: A short summary of the kind of problem, the same for every occurrence.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong this time, in words a developer can act on.
        instance:
          type: string
          description: The request path the problem happened on.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: The path of the field in the request, e.g. `channels[1].smsKeyword`.
              message:
                type: string
                description: What's wrong with it.

    # ------------------------------------------------------------ Topics
    TopicStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
      description: |
        `ACTIVE`: offered to subscribers and returned by recipient queries.
        `ARCHIVED`: no longer offered and returns no recipients; its subscriptions and history are kept.
    FilterField:
      type: object
      description: One way subscribers can narrow a topic, such as by region.
      required: [name, dataType, matchType]
      properties:
        name:
          $ref: '#/components/schemas/FilterFieldName'
          description: The field's key in a subscription's `filters`, e.g. `region`. Can't be changed later.
        label:
          type: string
          maxLength: 200
          description: The field's name as people see it on the manage page, e.g. "Region".
        dataType:
          type: string
          enum: [TEXT]
          description: |
            What kind of values the field holds. Only `TEXT` for now. Phase 2 adds `NUMBER`, so a
            subscriber can choose a number, such as a threshold, and have it compared as a number.
        matchType:
          type: string
          enum: [EXACT]
          description: |
            How a subscriber's values are compared with an event's. `EXACT`: the event's value must
            equal one of the values the subscriber chose. Phase 2 adds `MIN` and `MAX` for `NUMBER`
            fields, e.g. "only when the value is at least 50".
        allowMultiple:
          type: boolean
          default: true
          description: |
            Whether a subscriber can choose more than one value, e.g. both `victoria` and `nanaimo`.
            If `false`, they choose at most one.
        required:
          type: boolean
          default: false
          description: Subscribers must choose at least one value. If `false`, leaving the field empty matches every value.
        allowedValues:
          type: [array, 'null']
          items: { type: string, maxLength: 200 }
          description: If set, chosen values must come from this list. If `null`, any text is accepted.
    ConfirmationTemplate:
      type: object
      description: The confirmation message. Give either a Notify template ID or inline content.
      oneOf:
        - type: object
          required: [notifyTemplateId]
          properties:
            notifyTemplateId:
              type: string
              description: The ID of a template already set up in Notify for the tenant.
          additionalProperties: false
        - type: object
          required: [inline]
          properties:
            inline:
              type: object
              description: The message itself, for tenants that don't keep it as a Notify template.
              required: [body]
              properties:
                subject:
                  type: string
                  maxLength: 200
                  description: The email subject line. Email only.
                body:
                  type: string
                  maxLength: 5000
                  description: |
                    Email: must include `((confirmUrl))`, where CHOSEN inserts the link.
                    SMS: must tell the person to reply `YES`, or `<keyword> YES`;
                    `((confirmUrl))` is optional.
          additionalProperties: false
    TopicChannelSettings:
      type: object
      properties:
        confirmationRequired:
          type: boolean
          default: true
          description: |
            Double opt-in for this channel. If `true`, new subscriptions on this channel stay
            `PENDING` until the person confirms (email: the link; SMS: a `YES` reply or the link),
            and expire after the topic's `pendingExpiryMinutes`. Changing it affects only new
            subscriptions.
        confirmationTemplate:
          description: The message CHOSEN sends to ask the person to confirm. Required when `confirmationRequired` is `true`.
          $ref: '#/components/schemas/ConfirmationTemplate'
        smsKeyword:
          type: [string, 'null']
          pattern: '^[A-Z0-9]{2,10}$'
          description: SMS only. Unique across CHOSEN. A subscriber texts `<keyword> YES` to confirm a pending subscription to this topic, and `<keyword> OFF` to unsubscribe from it.
          examples: [ROADS]
    TopicChannel:
      allOf:
        - type: object
          required: [channel]
          properties:
            channel:
              $ref: '#/components/schemas/Channel'
              description: The channel these settings are for. A topic has at most one entry per channel.
        - $ref: '#/components/schemas/TopicChannelSettings'
    TopicCreate:
      type: object
      required: [key, name, channels]
      properties:
        key:
          $ref: '#/components/schemas/TopicKey'
          description: The tenant's own ID for the topic, used in URLs and by Notify. Can't be changed later.
        name:
          type: string
          maxLength: 200
          description: The topic's name as subscribers see it, e.g. on the confirm and manage pages.
        description:
          type: string
          maxLength: 2000
          description: A sentence or two telling subscribers what they'll get. Shown on the hosted pages.
        pendingExpiryMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          default: 1440
          description: |
            How long a person has to confirm, on any channel that requires confirmation. A
            subscription not confirmed in time becomes `EXPIRED` and is never sent to. Default 1440
            (24 hours); at most 10080 (7 days).
        redirectUrl:
          type: [string, 'null']
          format: uri
          description: Where the hosted pages send the person after they confirm or unsubscribe, usually back to the tenant's app. If empty, CHOSEN shows its own page.
        channels:
          type: array
          minItems: 1
          description: The channels the topic is offered on, each with its own settings.
          items: { $ref: '#/components/schemas/TopicChannel' }
        filterFields:
          type: array
          description: The ways subscribers can narrow the topic. Leave it out for a topic everyone gets in full.
          items: { $ref: '#/components/schemas/FilterField' }
    TopicUpdate:
      type: object
      description: Only the fields sent are changed.
      properties:
        name:
          type: string
          maxLength: 200
          description: The topic's name as subscribers see it.
        description:
          type: string
          maxLength: 2000
          description: What subscribers will get. Shown on the hosted pages.
        pendingExpiryMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          description: How long a person has to confirm. Applies to subscriptions created from now on.
        redirectUrl:
          type: [string, 'null']
          format: uri
          description: Where the hosted pages send the person afterwards. `null` to use CHOSEN's own page.
        status:
          $ref: '#/components/schemas/TopicStatus'
          description: Set to `ARCHIVED` to stop offering the topic, or `ACTIVE` to bring it back.
    Topic:
      allOf:
        - $ref: '#/components/schemas/TopicCreate'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
              description: CHOSEN's ID for the topic. The fixed "manage subscriptions" link uses it.
            status: { $ref: '#/components/schemas/TopicStatus' }
            manageUrl:
              type: string
              format: uri
              description: The fixed "manage subscriptions" link for this topic, for use in templates.
            createdAt:
              type: string
              format: date-time
              description: When the topic was created.
            updatedAt:
              type: string
              format: date-time
              description: When the topic, its channels or its filter fields last changed.

    # ----------------------------------------------------- Subscriptions
    SubscriptionStatus:
      type: string
      enum: [PENDING, ACTIVE, UNSUBSCRIBED, EXPIRED]
      description: |
        `PENDING`: waiting for the person to confirm.
        `ACTIVE`: receiving messages, unless the address is suppressed.
        `UNSUBSCRIBED`: the person, or the tenant, stopped it.
        `EXPIRED`: never confirmed in time; nothing was ever sent to it.
    ConsentEvidence:
      type: object
      description: How the person agreed. Stored as consent evidence.
      required: [method]
      properties:
        method:
          type: string
          enum: [WEB_FORM, ASSISTED, API, IMPORT]
          description: |
            `WEB_FORM`: the person submitted the tenant's form.
            `ASSISTED`: staff subscribed them, e.g. by phone.
            `API`: another system subscribed them.
            `IMPORT`: moved from an older list; confirmation is still sent if the channel requires it.
        text:
          type: string
          maxLength: 5000
          description: |
            Optional. The consent wording the person saw when they agreed, exactly as it was
            shown, with any placeholders filled in. Send the same string the app displays.
            Topic and filters are recorded separately, so this only needs what they don't
            say, such as how often messages come and how to cancel. Without it, the consent
            event records how and when the person subscribed, but not what they were told.
        capturedAt:
          type: string
          format: date-time
          description: When the person agreed. Defaults to the time of the request.
        sourceIp:
          type: string
          description: The person's IP address, if the tenant has it.
        userAgent:
          type: string
          maxLength: 500
          description: The person's browser user agent, if the tenant has it.
        actor:
          type: string
          maxLength: 200
          description: Who acted, as recorded by the tenant, e.g. a staff user ID.
    SubscriptionCreate:
      type: object
      required: [channel, address, consent]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
          description: How the person wants to receive messages. The topic must offer this channel.
        address:
          $ref: '#/components/schemas/Address'
          description: The email address or phone number to send to, matching `channel`.
        externalSubjectId:
          type: string
          maxLength: 200
          description: The tenant's own ID for the person, e.g. a user ID or BCSC GUID. Stored, never resolved.
        filters:
          $ref: '#/components/schemas/Filters'
          description: The values the person chose for the topic's filter fields.
        consent:
          $ref: '#/components/schemas/ConsentEvidence'
          description: How the person agreed, kept as proof.
    SubscriptionUpdate:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
          description: The new values. A field left out keeps its values; an empty array matches anything.
        actor:
          type: string
          maxLength: 200
          description: Who made the change, as recorded by the tenant, e.g. a staff user ID.
    Subscription:
      type: object
      description: One contact subscribed to one topic.
      required: [id, topicKey, contactId, channel, address, status, filters, suppressed, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the subscription.
        topicKey:
          $ref: '#/components/schemas/TopicKey'
          description: The topic subscribed to.
        contactId:
          type: string
          format: uuid
          description: The contact (address) that's subscribed.
        channel:
          $ref: '#/components/schemas/Channel'
          description: How messages are delivered.
        address:
          $ref: '#/components/schemas/Address'
          description: Where messages are sent.
        externalSubjectId:
          type: [string, 'null']
          description: The tenant's own ID for the person, if it gave one.
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        filters:
          $ref: '#/components/schemas/Filters'
          description: The values the person chose for the topic's filter fields.
        suppressed:
          type: boolean
          description: The address is suppressed, so it isn't returned as a recipient even if active.
        createdAt:
          type: string
          format: date-time
          description: When the person subscribed, or last subscribed again.
        confirmedAt:
          type: [string, 'null']
          format: date-time
          description: When the person confirmed, or became active straight away; `null` while pending.
        unsubscribedAt:
          type: [string, 'null']
          format: date-time
          description: When the subscription was unsubscribed; `null` otherwise.
        pendingExpiresAt:
          type: [string, 'null']
          format: date-time
          description: When a pending subscription will expire if not confirmed; `null` once it isn't pending.

    # ---------------------------------------------------------- Contacts
    Contact:
      type: object
      description: |
        One email address or phone number that belongs to one tenant, and the person behind it.
        CHOSEN creates contacts as people subscribe. A contact holds the address once, however
        many of the tenant's topics it's subscribed to. The same address used with two tenants
        is two contacts.
      required: [id, channel, address, suppressed]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the contact.
        channel:
          $ref: '#/components/schemas/Channel'
          description: Whether the address is an email address or a phone number.
        address:
          $ref: '#/components/schemas/Address'
          description: The email address or phone number.
        externalSubjectId:
          type: [string, 'null']
          description: The tenant's own ID for the person, if it gave one.
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: When the person first confirmed this address; `null` if they haven't yet.
        suppressed:
          type: boolean
          description: The address is suppressed, so nothing is sent to it until the suppression is lifted.
        replacedBy:
          type: [string, 'null']
          format: uuid
          description: Set when the address was changed; the contact that took over the subscriptions.
    ContactWithSubscriptions:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          required: [subscriptions]
          properties:
            subscriptions:
              type: array
              description: Every subscription this contact has with the tenant, in any status.
              items: { $ref: '#/components/schemas/Subscription' }

    # ------------------------------------------------------ Suppressions
    Suppression:
      type: object
      description: An address that must not be sent to, without deleting its subscriptions.
      required: [id, channel, address, scope, suppressedAt]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the suppression.
        channel:
          $ref: '#/components/schemas/Channel'
          description: Whether an email address or a phone number is suppressed.
        address:
          $ref: '#/components/schemas/Address'
          description: Shown from the tenant's matching contact; CHOSEN stores only a hash.
        sender:
          type: [string, 'null']
          description: SMS only. The sender number the suppression applies to, e.g. the number the person texted `STOP` to. `null` means every sender.
        scope:
          type: string
          enum: [TENANT, SHARED]
          description: '`SHARED` suppressions apply to every tenant: SMS `STOP` and email hard bounces.'
        reason:
          type: [string, 'null']
          enum: [MANUAL, COMPLAINT, null]
          description: Only shown for the tenant's own suppressions.
        note:
          type: [string, 'null']
          description: The tenant's note on why it suppressed the address. Only on the tenant's own suppressions.
        suppressedAt:
          type: string
          format: date-time
          description: When the suppression started.
        liftedAt:
          type: [string, 'null']
          format: date-time
          description: When it was lifted; `null` while it's in force.

    # ----------------------------------------------------------- History
    ConsentEvent:
      type: object
      description: A permanent record of one change to a subscription. Never edited or deleted.
      required: [id, subscriptionId, action, method, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the event.
        subscriptionId:
          type: string
          format: uuid
          description: The subscription that changed.
        action:
          type: string
          enum: [OPT_IN, CONFIRM, EXPIRE, FILTERS_CHANGED, OPT_OUT, ADDRESS_CHANGED]
          description: What happened.
        method:
          type: string
          enum: [WEB_FORM, ASSISTED, API, IMPORT, CONFIRM_LINK, SMS_REPLY, UNSUBSCRIBE_LINK, ONE_CLICK, MANAGE_PAGE, SMS_KEYWORD, SYSTEM]
          description: How it happened, e.g. the tenant's form, a reply to a text, or CHOSEN itself (`SYSTEM`, for expiry).
        text:
          type: [string, 'null']
          description: The wording the person was shown. For `OPT_IN`, what the tenant sent; for `CONFIRM`, the message CHOSEN sent.
        actor:
          type: [string, 'null']
          description: Who acted, if it wasn't the person themselves, e.g. a staff user ID.
        sourceIp:
          type: [string, 'null']
          description: The IP address the change came from, if known.
        userAgent:
          type: [string, 'null']
          description: The browser user agent the change came from, if known.
        filters:
          description: The filters after the change, for `OPT_IN` and `FILTERS_CHANGED`.
          oneOf:
            - $ref: '#/components/schemas/Filters'
            - type: 'null'
        occurredAt:
          type: string
          format: date-time
          description: When it happened.
    AuditEvent:
      type: object
      description: A change to the tenant's topics or settings. Subscription changes are consent events instead.
      required: [id, entityType, entityId, action, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the event.
        entityType:
          type: string
          description: The kind of thing that changed, e.g. `TOPIC` or `FILTER_FIELD`.
        entityId:
          type: string
          format: uuid
          description: The ID of the thing that changed.
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE]
          description: Whether it was created, changed or removed.
        actor:
          type: [string, 'null']
          description: Who made the change, e.g. a staff user or a client ID.
        changes:
          type: object
          description: Changed fields, each with `from` and `to`.
          additionalProperties:
            type: object
            properties:
              from:
                description: The value before.
              to:
                description: The value after.
        occurredAt:
          type: string
          format: date-time
          description: When it happened.

    # -------------------------------------------------------- Recipients
    RecipientQuery:
      type: object
      required: [tenantId, topicKey, channel]
      properties:
        tenantId:
          type: string
          description: The CSTAR tenant ID that Notify is sending for.
        topicKey:
          $ref: '#/components/schemas/TopicKey'
          description: The topic the message is about.
        channel:
          $ref: '#/components/schemas/Channel'
          description: The channel Notify is sending on.
        sender:
          type: string
          description: Required for SMS. The number Notify will send from, used to apply `STOP` suppressions.
          examples: ['+12505550100']
        filters:
          $ref: '#/components/schemas/Filters'
          description: The event's values. A subscriber matches if, for every field they chose values for, at least one is in this list.
        cursor:
          type: string
          description: The `nextCursor` from the previous page. Leave it out for the first page.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
          description: The most recipients to return in one page.
    Recipient:
      type: object
      description: One person to send the message to.
      required: [subscriptionId, channel, address, unsubscribeUrl]
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: The subscription this recipient matched through. Send it back in delivery events.
        channel:
          $ref: '#/components/schemas/Channel'
          description: The channel to send on.
        address:
          $ref: '#/components/schemas/Address'
          description: Where to send it.
        externalSubjectId:
          type: [string, 'null']
          description: The tenant's own ID for the person, if it gave one.
        unsubscribeUrl:
          type: string
          format: uri
          description: |
            Signed link for this recipient and topic. Put it in the message body, and for email also in
            `List-Unsubscribe: <unsubscribeUrl>` with `List-Unsubscribe-Post: List-Unsubscribe=One-Click`.
    RecipientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The recipients on this page.
          items: { $ref: '#/components/schemas/Recipient' }
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; `null` on the last page. Valid for 15 minutes.
        manageUrl:
          type: string
          format: uri
          description: The topic's fixed "manage subscriptions" link, for templates that can't use a link per recipient.

    # ----------------------------------------------------------- Inbound
    InboundSms:
      type: object
      required: [eventId, from, to, body, receivedAt]
      properties:
        eventId:
          type: string
          description: Notify's ID for this inbound message. Used to ignore repeat deliveries.
        from:
          type: string
          description: The person's phone number, in E.164.
        to:
          type: string
          description: The sender number or short code the text was sent to.
        body:
          type: string
          maxLength: 1600
          description: What the person texted, e.g. `ROADS OFF`.
        provider:
          type: string
          description: The SMS provider that received the text.
          examples: [ACS, AWS, TWILIO]
        providerMessageId:
          type: string
          description: The provider's ID for the text, for tracing.
        providerOptOutApplied:
          type: boolean
          description: The provider reports it has already opted the number out (or back in).
        receivedAt:
          type: string
          format: date-time
          description: When the provider received the text.
    InboundSmsResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [STOP_APPLIED, START_APPLIED, KEYWORD_OPT_OUT, KEYWORD_NOT_SUBSCRIBED, CONFIRMED, CONFIRM_AMBIGUOUS, NOTHING_TO_CONFIRM, HELP_SENT, UNRECOGNISED, DUPLICATE]
          description: |
            What CHOSEN did with the text.
            `CONFIRMED`: a pending subscription became `ACTIVE`.
            `CONFIRM_AMBIGUOUS`: a plain `YES` matched several pending subscriptions; none was confirmed.
            `NOTHING_TO_CONFIRM`: a `YES` matched no pending subscription, e.g. it had expired.
        replySent:
          type: boolean
          description: CHOSEN sent a reply through Notify.
    DeliveryEvent:
      type: object
      required: [eventId, type, channel, address, occurredAt]
      properties:
        eventId:
          type: string
          description: Notify's ID for this event. Used to ignore repeat deliveries.
        type:
          type: string
          enum: [EMAIL_HARD_BOUNCE, EMAIL_COMPLAINT, SMS_OPTED_OUT]
          description: What happened to the message; see `receiveDeliveryEvent` for what CHOSEN does with each.
        tenantId:
          type: string
          description: The CSTAR tenant ID the message was sent for. Required for `EMAIL_COMPLAINT`.
        channel:
          $ref: '#/components/schemas/Channel'
          description: The channel the message was sent on.
        address:
          $ref: '#/components/schemas/Address'
          description: The address the message was sent to.
        sender:
          type: string
          description: Required for `SMS_OPTED_OUT`.
        subscriptionId:
          type: string
          format: uuid
          description: If Notify knows which subscription the message was sent for.
        occurredAt:
          type: string
          format: date-time
          description: When the provider reported it.

    # ------------------------------------------------------------ Public
    PublicSubscriptionSummary:
      type: object
      description: What a hosted page shows about the subscription a link belongs to.
      required: [topicName, tenantName, channel, maskedAddress, status]
      properties:
        topicName:
          type: string
          description: The topic's name, as subscribers see it.
        topicDescription:
          type: [string, 'null']
          description: The topic's description, if it has one.
        tenantName:
          type: string
          description: The name of the service the subscription is with.
        channel:
          $ref: '#/components/schemas/Channel'
          description: How the person receives messages.
        maskedAddress:
          type: string
          description: The address with most of it hidden, so the person can recognise it without the page revealing it.
          examples: ['p***n@example.com', '+1250***0123']
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
    PublicActionResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
          description: The subscription's status after the action.
        redirectUrl:
          type: [string, 'null']
          format: uri
          description: The topic's redirect, if it has one; otherwise the page shows its own message.
    PublicManageView:
      type: object
      description: What the manage page shows the signed-in person.
      required: [tenantName, channel, maskedAddress, subscriptions]
      properties:
        tenantName:
          type: string
          description: The name of the service the subscriptions are with.
        channel:
          $ref: '#/components/schemas/Channel'
          description: Whether the person signed in with an email address or a phone number.
        maskedAddress:
          type: string
          description: The address with most of it hidden.
        expiresAt:
          type: string
          format: date-time
          description: When the sign-in link stops working.
        subscriptions:
          type: array
          description: The person's subscriptions with this tenant.
          items:
            type: object
            required: [id, topicName, status, filters, filterFields]
            properties:
              id:
                type: string
                format: uuid
                description: The subscription's ID, used to change or unsubscribe it.
              topicName:
                type: string
                description: The topic's name.
              topicDescription:
                type: [string, 'null']
                description: The topic's description, if it has one.
              status: { $ref: '#/components/schemas/SubscriptionStatus' }
              filters:
                $ref: '#/components/schemas/Filters'
                description: The values the person has chosen.
              filterFields:
                type: array
                description: The topic's filter fields, so the page can offer the choices.
                items: { $ref: '#/components/schemas/FilterField' }

    # ------------------------------------------------------- Credentials
    ApiClient:
      type: object
      description: Client credentials a service uses to call CHOSEN. The secret is never included.
      required: [clientId, label, issuedAt, issuedBy]
      properties:
        clientId:
          type: string
          description: |
            Issued by the API Services Portal as `<environment appId>-<application appId>`.
            Tokens carry it as `azp`.
          examples: [D5C97345-4B7E21C09A6]
        label:
          type: string
          description: The name given when the credentials were created, to tell them apart.
          examples: [Road closures app (PROD)]
        systemRole:
          type: [string, 'null']
          enum: [NOTIFY, null]
          description: Set only on system credentials; tenant credentials have `null`.
        issuedBy:
          type: string
          description: Who created the credentials.
        issuedAt:
          type: string
          format: date-time
          description: When the credentials were created.
        rotatedAt:
          type: [string, 'null']
          format: date-time
          description: When the secret was last replaced; `null` if never.
        revokedBy:
          type: [string, 'null']
          description: Who revoked the credentials; `null` if they're still in use.
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: When they were revoked; `null` if they're still in use.
    IssuedApiClient:
      description: Returned only when credentials are created or rotated.
      allOf:
        - $ref: '#/components/schemas/ApiClient'
        - type: object
          required: [clientSecret, tokenUrl]
          properties:
            clientSecret:
              type: string
              description: Shown once. CHOSEN doesn't store it and can't show it again.
            tokenUrl:
              type: string
              format: uri
              description: Where the service exchanges its client ID and secret for a token.
              examples: [https://loginproxy.gov.bc.ca/auth/realms/apigw/protocol/openid-connect/token]
    ApiClientCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 100
          description: Tells the tenant's credentials apart, e.g. by app and environment.
          examples: [Road closures app (PROD)]
    SystemApiClientCreate:
      type: object
      required: [systemRole, label]
      properties:
        systemRole:
          type: string
          enum: [NOTIFY]
          description: The system the credentials are for.
        label:
          type: string
          maxLength: 100
          description: Tells the system credentials apart, e.g. by environment.
          examples: [Notify PROD]

    # ------------------------------------------------------------- Admin
    Tenant:
      type: object
      description: A service that uses CHOSEN.
      required: [id, externalId, name, slug, status]
      properties:
        id:
          type: string
          format: uuid
          description: CHOSEN's ID for the tenant.
        externalId:
          type: string
          description: The CSTAR tenant ID, the same one Notify uses.
        name:
          type: string
          description: The service's name, shown to subscribers on the hosted pages.
